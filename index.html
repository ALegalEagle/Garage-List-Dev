<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Aggressive iOS PWA Cache Busting -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Universal Environment Auto-Detector with Cache Versioning -->
  <script>
    (function() {
      const APP_VER = "5.3.1";
      const isDev = window.location.pathname.toLowerCase().includes('dev');
      const appName = isDev ? "Garage DEV" : "Garage List";
      const appIcon = isDev ? "blueprint-icon.png" : "apple-touch-icon.png";
      const appScope = isDev ? "https://alegaleagle.github.io/Garage-List-Dev/" : "https://alegaleagle.github.io/Garage-List/";
      const themeColor = isDev ? "#075985" : "#0f172a";

      document.title = appName;

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.update();
          }
        });
      }

      document.write(`
        <meta name="apple-mobile-web-app-title" content="${appName}" />
        <link id="dynamicFavicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='${encodeURIComponent(themeColor)}'/%3E%3C/svg%3E" />
        <link rel="apple-touch-icon" sizes="180x180" href="${appIcon}?v=${APP_VER}" />
        <link rel="manifest" href='data:application/manifest+json,{"name":"${appName}","short_name":"${appName}","start_url":"${appScope}?v=${APP_VER}","scope":"${appScope}","display":"standalone","background_color":"${themeColor}","theme_color":"${themeColor}","icons":[{"src":"${appIcon}?v=${APP_VER}","sizes":"180x180","type":"image/png"}]}' />
      `);
    })();
  </script>

  <!-- HTML5 Barcode Scanner Engine -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --bg: #f4f4f6;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --pill-bg: #e2e8f0;
      --stepper-bg: #f8fafc;
      --fab-bg: #5c6b73;
      --fab-text: #ffffff;
      
      --pill-bar-bg: #f8fafc;
      --pill-bar-border: #e2e8f0;
      --pill-active-bg: #e2e8f0;
      --pill-icon: #64748b;
      --pill-icon-active: #0f172a;

      --out-border: #dc2626;
      --out-badge: #ef4444;
      --out-bg: #fff1f2;
      --low-border: #f59e0b;
      --low-badge: #f59e0b;
      --low-bg: #fffbeb;
      --synced-color: #10b981;
      --bring-color: #e52e41;
      --speeddial-blur-bg: rgba(255, 255, 255, 0.72);
    }

    body.dark {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --pill-bg: #334155;
      --stepper-bg: #0f172a;
      --fab-bg: #475569;
      --fab-text: #ffffff;

      --pill-bar-bg: #1e293b;
      --pill-bar-border: #334155;
      --pill-active-bg: #334155;
      --pill-icon: #94a3b8;
      --pill-icon-active: #ffffff;

      --out-border: #ef4444;
      --out-badge: #ef4444;
      --out-bg: #450a0a;
      --low-border: #f59e0b;
      --low-badge: #f59e0b;
      --low-bg: #451a03;
      --synced-color: #34d399;
      --bring-color: #ef4444;
      --speeddial-blur-bg: rgba(15, 23, 42, 0.76);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      transition: background 0.15s ease, color 0.15s ease; 
      user-select: none;
      -webkit-user-select: none;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container { 
      max-width: 1200px; 
      margin: 0 auto; 
      padding-top: calc(env(safe-area-inset-top, 20px) + 12px);
      padding-left: clamp(16px, 4vw, 32px);
      padding-right: clamp(16px, 4vw, 32px);
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 110px);
    }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .header-top { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    
    .circle-icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .title-area { margin-bottom: 12px; }
    .title-area h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.8px; }
    
    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--synced-color);
      margin-left: 8px;
    }
    .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--synced-color); display: inline-block; }
    .sync-pill.offline { color: var(--out-border) !important; border-color: var(--out-border) !important; }
    .sync-pill.offline .sync-dot { background: var(--out-border) !important; }

    .search-bar-container { position: relative; margin-bottom: 16px; }
    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px 16px 12px 42px;
      font-size: 15px;
      color: var(--text);
      outline: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .tab-content { display: none; }
    .tab-content.active-tab { display: block; }

    /* Bento Grid & Cards */
    .bento-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat-card { border-radius: 16px; padding: 12px 16px; border-width: 2px; border-style: solid; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
    .stat-card.out { background: var(--out-bg); border-color: var(--out-border); }
    .stat-card.low { background: var(--low-bg); border-color: var(--low-border); }
    .stat-card.active-filter-card { box-shadow: 0 0 0 3px var(--fab-bg); }
    .stat-label { font-size: 10px; font-weight: 800; letter-spacing: 0.6px; }
    .stat-card.out .stat-label { color: var(--out-badge); }
    .stat-card.low .stat-label { color: var(--low-badge); }
    .stat-value { font-size: 22px; font-weight: 800; line-height: 1; margin-top: 4px; }

    .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 16px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .chip { padding: 6px 14px; border-radius: 16px; font-size: 12px; font-weight: 700; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-muted); cursor: pointer; white-space: nowrap; }
    .chip.active { background: var(--fab-bg); color: var(--fab-text); border-color: var(--fab-bg); }

    .bento-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; }
    .bento-card { 
      background: var(--card-bg); 
      border-radius: 18px; 
      padding: 14px; 
      border: 1px solid var(--border); 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      min-height: 115px; 
      position: relative; 
      cursor: pointer;
    }
    .bento-card.is-out { border: 2.5px solid var(--out-border) !important; }
    .bento-card.is-low { border: 2px solid var(--low-border) !important; }

    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .category-chip { font-size: 10px; font-weight: 700; padding: 2.5px 7px; border-radius: 6px; background: var(--pill-bg); color: var(--text-muted); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 58%; }
    .status-badge { font-size: 9px; font-weight: 800; padding: 3px 6px; border-radius: 5px; color: #fff; white-space: nowrap; }
    .badge-out { background: var(--out-badge); }
    .badge-low { background: var(--low-badge); }

    .card-title { font-size: 14px; font-weight: 700; line-height: 1.25; margin-bottom: 10px; word-break: break-word; }

    .stepper-pill { background: var(--stepper-bg); border-radius: 10px; display: flex; align-items: center; justify-content: space-between; padding: 4px 6px; height: 32px; border: 1px solid var(--border); }
    .stepper-btn { background: transparent; border: none; font-size: 16px; font-weight: 700; color: var(--text-muted); width: 26px; height: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
    .stepper-count { font-size: 15px; font-weight: 800; }
    .count-out { color: var(--out-border) !important; }
    .count-low { color: var(--low-border) !important; }

    /* TICKTICK SLIDING INDICATOR BAR */
    .ticktick-island-bar {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 12px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--pill-bar-bg);
      border: 1px solid var(--pill-bar-border);
      padding: 4px;
      border-radius: 36px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      z-index: 90;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .ticktick-tab {
      background: transparent;
      border: none;
      width: 60px;
      height: 40px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .ticktick-indicator {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 60px;
      height: 40px;
      border-radius: 20px;
      background: var(--pill-active-bg);
      z-index: 1;
      transition: transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .ticktick-icon {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: var(--pill-icon);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    .ticktick-tab.active .ticktick-icon {
      stroke: var(--pill-icon-active);
    }

    .ticktick-dot-badge {
      position: absolute;
      top: 9px;
      right: 16px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--out-badge);
      z-index: 3;
    }

    /* FLOATING FAB (+) */
    .ticktick-fab {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 12px);
      right: clamp(16px, 5vw, 32px);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #5c6b73;
      color: #ffffff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.22);
      z-index: 91;
      touch-action: manipulation;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    body.dark .ticktick-fab {
      background: #475569;
    }
    .ticktick-fab.is-open {
      transform: rotate(45deg);
      background: #dc2626 !important;
    }

    /* SPEED DIAL OVERLAY */
    .speeddial-overlay {
      position: fixed;
      inset: 0;
      background: var(--speeddial-blur-bg);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      z-index: 92;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .speeddial-overlay.active { opacity: 1; pointer-events: auto; }

    .speeddial-menu {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 80px);
      right: clamp(16px, 5vw, 32px);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      z-index: 95;
      pointer-events: none;
    }
    .speeddial-menu.active { pointer-events: auto; }

    .speeddial-item {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px 18px;
      border-radius: 30px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      opacity: 0;
      transform: translateY(18px) scale(0.92);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .speeddial-menu.active .speeddial-item { opacity: 1; transform: translateY(0) scale(1); }

    .speeddial-icon-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--pill-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    /* Modals & Sheets */
    .modal-overlay { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.6); 
      z-index: 99; 
      align-items: flex-end; 
      justify-content: center; 
    }
    .modal-overlay.open { display: flex; }
    .modal { 
      background: var(--card-bg); 
      width: 100%; 
      max-width: 520px; 
      border-radius: 28px 28px 0 0; 
      padding: 24px 20px calc(env(safe-area-inset-bottom, 20px) + 32px) 20px; 
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .modal-cancel-btn { background: none; border: none; font-size: 15px; font-weight: 700; color: var(--text-muted); cursor: pointer; }
    .modal-title-header { font-size: 16px; font-weight: 800; }
    .modal-save-btn { background: var(--fab-bg); color: var(--fab-text); border: none; padding: 6px 16px; border-radius: 14px; font-size: 14px; font-weight: 800; cursor: pointer; }

    .form-group { margin-bottom: 18px; }
    .form-label { font-size: 11px; font-weight: 800; letter-spacing: 0.6px; color: var(--text-muted); margin-bottom: 8px; display: block; text-transform: uppercase; }
    .input-field { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 14px; font-size: 15px; background: var(--bg); color: var(--text); outline: none; }

    .modal-cat-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .modal-cat-pill { padding: 8px 14px; border-radius: 14px; font-size: 13px; font-weight: 700; border: 1px solid var(--border); background: var(--bg); color: var(--text-muted); cursor: pointer; }
    .modal-cat-pill.active { background: var(--fab-bg); color: var(--fab-text); border-color: var(--fab-bg); }

    .modal-stepper { display: flex; align-items: center; justify-content: space-between; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 8px 16px; }
    .modal-step-btn { background: var(--card-bg); border: 1px solid var(--border); font-size: 20px; font-weight: 800; color: var(--text); width: 40px; height: 40px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .modal-step-val { font-size: 20px; font-weight: 800; }

    #scannerRegion { position: relative; width: 100%; min-height: 260px; background: #000; border-radius: 18px; overflow: hidden; }
    .scan-reticle { position: absolute; inset: 20px; pointer-events: none; border: 2px dashed rgba(56, 189, 248, 0.7); border-radius: 12px; }
    .scanner-result-box { margin-top: 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: none; }

    .shopping-item-row { display: flex; align-items: center; justify-content: space-between; padding: 14px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 8px; cursor: pointer; }
    .shopping-chk { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex-shrink: 0; }
    .shopping-item-row.is-bought .shopping-chk { background: var(--synced-color); border-color: var(--synced-color); color: white; }
    .shopping-item-row.is-bought .shopping-title { text-decoration: line-through; opacity: 0.6; }

    .cat-manage-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 8px; }
    .cat-del-btn { background: none; border: none; color: var(--out-border); font-size: 16px; cursor: pointer; }
    .btn-action-primary { width: 100%; padding: 15px; background: var(--fab-bg); color: var(--fab-text); border: none; border-radius: 16px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <button class="circle-icon-btn" onclick="toggleSelectionMode()" title="Selection / Bin Mode">🗑️</button>
        <div class="theme-switch" style="display: flex; gap: 6px;">
          <button class="circle-icon-btn" id="btnLight" onclick="setTheme('light')">☀️</button>
          <button class="circle-icon-btn" id="btnDark" onclick="setTheme('dark')">🌙</button>
        </div>
      </div>
    </header>

    <div class="title-area">
      <h1 id="appHeaderTitle">Garage List</h1>
      <div class="sync-pill" id="syncStatus">
        <span class="sync-dot"></span>
        <span id="syncText">Connecting...</span>
      </div>
    </div>

    <!-- TAB 1: INVENTORY VIEW -->
    <div class="tab-content active-tab" id="tab-inventory">
      <div class="search-bar-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search garage items..." oninput="handleSearchInput()" autocomplete="off" />
      </div>

      <div class="bento-stats">
        <div class="stat-card out" id="statCardOut" onclick="toggleQuickFilter('out')">
          <div class="stat-label">OUT OF STOCK</div>
          <div class="stat-value" id="outCount">0 items</div>
        </div>
        <div class="stat-card low" id="statCardLow" onclick="toggleQuickFilter('low')">
          <div class="stat-label">LOW STOCK</div>
          <div class="stat-value" id="lowCount">0 items</div>
        </div>
      </div>

      <div class="filters" id="categoryFilters"></div>
      <div class="bento-grid" id="bentoGrid"></div>
    </div>

    <!-- TAB 2: IN-APP SHOPPING VIEW -->
    <div class="tab-content" id="tab-shopping">
      <div style="margin-bottom: 16px;">
        <h2 style="font-size: 22px; font-weight: 800;">Shopping List</h2>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 2px;">Tap items to mark them as in-cart during your shopping run.</p>
      </div>

      <div id="shoppingListContainer"></div>

      <button class="btn-action-primary" onclick="completeShoppingSession()">
        ✓ Finish Shopping & Restock
      </button>

      <button class="btn-action-primary" style="background: var(--bring-color); color: white; margin-top: 8px;" onclick="exportToBringApp()">
        🛒 Open Out-of-Stock in Bring! App
      </button>
    </div>

    <!-- TAB 3: SETTINGS VIEW -->
    <div class="tab-content" id="tab-settings">
      <div style="margin-bottom: 20px;">
        <h2 style="font-size: 22px; font-weight: 800;">App Settings</h2>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 2px;">Manage categories and alerts</p>
      </div>

      <div class="form-group">
        <label class="form-label">Manage Categories</label>
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
          <input type="text" id="newCatInput" class="input-field" placeholder="New category name..." />
          <button class="circle-icon-btn" style="border-radius: 14px; width: 50px; flex-shrink: 0; background: var(--fab-bg); color: var(--fab-text);" onclick="addNewCategoryFromSettings()">+</button>
        </div>
        <div id="categoryManageList"></div>
      </div>

      <div class="form-group" style="margin-top: 24px;">
        <label class="form-label">Lock Screen Alerts</label>
        <button class="btn-action-primary" style="background: var(--card-bg); color: var(--text); border: 1px solid var(--border);" onclick="enableLockscreenAlerts()">
          🔔 Enable Push Notifications
        </button>
      </div>
    </div>
  </div>

  <!-- SLIDING INDICATOR TAB BAR -->
  <nav class="ticktick-island-bar">
    <div class="ticktick-indicator" id="tabIndicator"></div>

    <button class="ticktick-tab active" id="btn-tab-inventory" onclick="switchTab('inventory', 0)" title="Inventory">
      <svg class="ticktick-icon" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="5" stroke-width="2.2" />
        <path d="M9 12l2 2 4-4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <button class="ticktick-tab" id="btn-tab-shopping" onclick="switchTab('shopping', 1)" title="Shopping">
      <svg class="ticktick-icon" viewBox="0 0 24 24">
        <circle cx="9" cy="20" r="1.5" />
        <circle cx="18" cy="20" r="1.5" />
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
      </svg>
      <span class="ticktick-dot-badge" id="shoppingBadge" style="display:none;"></span>
    </button>

    <button class="ticktick-tab" id="btn-tab-settings" onclick="switchTab('settings', 2)" title="Settings">
      <svg class="ticktick-icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3.2" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
    </button>
  </nav>

  <!-- FLOATING FAB (+) -->
  <button class="ticktick-fab" id="fabAdd" title="Add Item">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </button>

  <!-- SPEED DIAL OVERLAY -->
  <div class="speeddial-overlay" id="speedDialOverlay" onclick="closeSpeedDialMenu()"></div>

  <div class="speeddial-menu" id="speedDialMenu">
    <div class="speeddial-item" onclick="selectSpeedDialAction('scan')">
      <div class="speeddial-icon-badge">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2" />
          <line x1="7" y1="12" x2="17" y2="12" />
        </svg>
      </div>
      <span>Scan Barcode</span>
    </div>
    <div class="speeddial-item" onclick="selectSpeedDialAction('manual')">
      <div class="speeddial-icon-badge">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
        </svg>
      </div>
      <span>Add Manually</span>
    </div>
  </div>

  <!-- Barcode Scanner Modal -->
  <div class="modal-overlay" id="scannerModalOverlay" onclick="if(event.target===this) toggleScannerModal(false)">
    <div class="modal">
      <div class="modal-top-bar">
        <button class="modal-cancel-btn" onclick="toggleScannerModal(false)">Done</button>
        <div class="modal-title-header">Barcode Scanner</div>
        <div style="width: 48px;"></div>
      </div>
      <div id="scannerRegion"><div class="scan-reticle"></div></div>
      <div id="scannerStatusText" style="margin-top: 12px; font-size: 13px; color: var(--text-muted); text-align: center;">Point camera at barcode</div>
      <div class="scanner-result-box" id="scannerResultBox"></div>
    </div>
  </div>

  <!-- New Item Modal -->
  <div class="modal-overlay" id="addModalOverlay" onclick="if(event.target===this) toggleAddModal(false)">
    <div class="modal">
      <div class="modal-top-bar">
        <button class="modal-cancel-btn" onclick="toggleAddModal(false)">Cancel</button>
        <div class="modal-title-header">New Item</div>
        <button class="modal-save-btn" onclick="addNewItem()">Save</button>
      </div>

      <div class="form-group">
        <label class="form-label">What's the item?</label>
        <input type="text" id="newItemName" class="input-field" placeholder="e.g. WD-40 Lubricant" autocomplete="off" />
      </div>
      <input type="hidden" id="newItemBarcode" value="" />

      <div class="form-group">
        <label class="form-label">Category</label>
        <div class="modal-cat-grid" id="modalCatGrid"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Starting Quantity</label>
        <div class="modal-stepper">
          <button class="modal-step-btn" onclick="adjustModalQty(-1)">—</button>
          <span class="modal-step-val" id="modalQtyVal">1</span>
          <button class="modal-step-btn" onclick="adjustModalQty(1)">+</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Item Settings Sheet -->
  <div class="modal-overlay" id="editCatModalOverlay" onclick="if(event.target===this) closeItemCategoryPicker()">
    <div class="modal">
      <div class="modal-top-bar">
        <button class="modal-cancel-btn" onclick="closeItemCategoryPicker()">Done</button>
        <div class="modal-title-header">Item Settings</div>
        <div style="width: 50px;"></div>
      </div>
      <div style="font-size: 16px; font-weight: 800; margin-bottom: 16px;" id="editCatItemName">Settings</div>
      <div class="form-group">
        <label class="form-label">Category</label>
        <div class="modal-cat-grid" id="editCatPickerGrid"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Low Stock Threshold</label>
        <div class="modal-stepper">
          <button class="modal-step-btn" onclick="adjustEditingItemMinStock(-1)">—</button>
          <span class="modal-step-val" id="editModalMinStockVal">≤ 1 item</span>
          <button class="modal-step-btn" onclick="adjustEditingItemMinStock(1)">+</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, onSnapshot, setDoc, addDoc, updateDoc, writeBatch, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const APP_VERSION = "5.3.1";
    const firebaseConfig = {
      apiKey: "AIzaSyAMznXG0OXHqMdfrmOGHK-g08TugsYfWw8",
      authDomain: "garage-stock-747e8.firebaseapp.com",
      projectId: "garage-stock-747e8",
      storageBucket: "garage-stock-747e8.firebasestorage.app",
      messagingSenderId: "106742830571",
      appId: "1:106742830571:web:dc208ba354f0d71516b5ae"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const itemsCol = collection(db, "garage_items");
    const metaDoc = doc(db, "garage_meta", "categories");
    const defaultCategories = ["Cereal", "Gluten Free Cereal", "Cleaning", "Household", "Condiments", "Spreads", "Kitchenware"];

    let items = [];
    let categories = defaultCategories;
    let currentFilter = "All";
    let quickFilter = null; 
    let searchQuery = "";
    let editingItemId = null;
    let editingItemMinStock = 1;
    let shoppingCart = new Set();
    let selectedModalCategory = "";
    let modalInitialQty = 1;

    let html5QrCode = null;
    let isScannerRunning = false;
    let activeScannedItemId = null;
    let isSpeedDialOpen = false;

    const dom = {
      body: document.body,
      grid: document.getElementById('bentoGrid'),
      filterBar: document.getElementById('categoryFilters'),
      outCount: document.getElementById('outCount'),
      lowCount: document.getElementById('lowCount'),
      syncStatus: document.getElementById('syncStatus'),
      syncText: document.getElementById('syncText'),
      searchInput: document.getElementById('searchInput'),
      shoppingListContainer: document.getElementById('shoppingListContainer'),
      shoppingBadge: document.getElementById('shoppingBadge'),
      categoryManageList: document.getElementById('categoryManageList'),
      fabAdd: document.getElementById('fabAdd'),
      speedDialOverlay: document.getElementById('speedDialOverlay'),
      speedDialMenu: document.getElementById('speedDialMenu'),
      addModalOverlay: document.getElementById('addModalOverlay'),
      newItemName: document.getElementById('newItemName'),
      newItemBarcode: document.getElementById('newItemBarcode'),
      modalCatGrid: document.getElementById('modalCatGrid'),
      modalQtyVal: document.getElementById('modalQtyVal'),
      scannerModalOverlay: document.getElementById('scannerModalOverlay'),
      scannerStatusText: document.getElementById('scannerStatusText'),
      scannerResultBox: document.getElementById('scannerResultBox'),
      editCatModalOverlay: document.getElementById('editCatModalOverlay'),
      editCatPickerGrid: document.getElementById('editCatPickerGrid'),
      editCatItemName: document.getElementById('editCatItemName'),
      tabIndicator: document.getElementById('tabIndicator')
    };

    // AUDIO BEEP ON SCAN
    function playBeepSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {
        console.warn("Audio Context audio beep blocked by browser policy:", e);
      }
    }

    // ANIMATED SLIDING TAB SWITCHER
    window.switchTab = function(tabId, index) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
      document.querySelectorAll('.ticktick-tab').forEach(b => b.classList.remove('active'));

      document.getElementById(`tab-${tabId}`)?.classList.add('active-tab');
      document.getElementById(`btn-tab-${tabId}`)?.classList.add('active');

      if (dom.tabIndicator) {
        dom.tabIndicator.style.transform = `translateX(${index * 64}px)`;
      }

      if (navigator.vibrate) navigator.vibrate(25);
    };

    window.setTheme = function(mode) {
      if (mode === 'dark') {
        dom.body.classList.add('dark');
      } else {
        dom.body.classList.remove('dark');
      }
      localStorage.setItem('garage_theme', mode);
    };

    const savedTheme = localStorage.getItem('garage_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    window.setTheme(savedTheme);

    window.handleSearchInput = function() {
      searchQuery = dom.searchInput.value.trim().toLowerCase();
      render();
    };

    function isItemOutOfStock(item) { return item.amount === 0; }
    function isItemLowStock(item) {
      const threshold = item.minStock !== undefined ? item.minStock : 1;
      return threshold > 0 && item.amount > 0 && item.amount <= threshold;
    }

    function initRealtimeDatabase() {
      onSnapshot(metaDoc, (snap) => {
        if (snap.exists() && Array.isArray(snap.data().list)) {
          categories = snap.data().list;
        } else {
          categories = defaultCategories;
        }
        render();
        renderCategorySettings();
      });

      onSnapshot(itemsCol, (snapshot) => {
        const loaded = [];
        snapshot.forEach((d) => {
          loaded.push({ id: d.id, ...d.data() });
        });
        loaded.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        items = loaded;
        render();
        renderShoppingTab();
      });
    }

    window.updateStock = async function(id, delta, event) {
      if (event) event.stopPropagation();
      const item = items.find((i) => i.id === id);
      if (!item || (item.amount <= 0 && delta < 0)) return;

      item.amount += delta;
      render();

      await updateDoc(doc(db, "garage_items", id), {
        amount: increment(delta),
        updatedAt: serverTimestamp()
      }).catch(console.error);
    };

    // BARCODE SCANNER CONTROLLER
    window.toggleScannerModal = async function(show) {
      if (show) {
        dom.scannerResultBox.style.display = 'none';
        dom.scannerResultBox.innerHTML = '';
        dom.scannerStatusText.innerText = "Initializing camera...";
        dom.scannerModalOverlay.classList.add('open');

        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("scannerRegion");
        }

        try {
          await html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 220, height: 220 } },
            onBarcodeScanned,
            () => {}
          );
          isScannerRunning = true;
          dom.scannerStatusText.innerText = "Point camera at barcode";
        } catch (err) {
          console.error("Camera access failed:", err);
          dom.scannerStatusText.innerText = "Unable to access camera.";
        }
      } else {
        if (html5QrCode && isScannerRunning) {
          try {
            await html5QrCode.stop();
          } catch (e) { console.warn("Scanner stop error:", e); }
          isScannerRunning = false;
        }
        dom.scannerModalOverlay.classList.remove('open');
      }
    };

    async function onBarcodeScanned(decodedText) {
      playBeepSound();
      if (navigator.vibrate) navigator.vibrate(60);

      const existingItem = items.find(i => i.barcode === decodedText);

      if (existingItem) {
        activeScannedItemId = existingItem.id;
        dom.scannerStatusText.innerText = `Matched item in inventory:`;
        dom.scannerResultBox.style.display = 'block';
        dom.scannerResultBox.innerHTML = `
          <div style="font-weight:800; font-size:16px;">${existingItem.name}</div>
          <div style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">Current Stock: ${existingItem.amount}</div>
          <div style="display:flex; gap:8px;">
            <button class="modal-save-btn" style="flex:1;" onclick="updateStock('${existingItem.id}', 1); toggleScannerModal(false);">+ Add 1 Stock</button>
            <button class="modal-cancel-btn" style="flex:1; border:1px solid var(--border); border-radius:12px;" onclick="updateStock('${existingItem.id}', -1); toggleScannerModal(false);">- Subtract 1</button>
          </div>
        `;
      } else {
        dom.scannerStatusText.innerText = "New barcode found. Fetching product info...";
        dom.scannerResultBox.style.display = 'block';
        dom.scannerResultBox.innerHTML = `<div style="font-size:13px; color:var(--text-muted);">Searching product databases...</div>`;

        let fetchedName = "";
        try {
          const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${decodedText}.json`);
          const data = await res.json();
          if (data.status === 1 && data.product && data.product.product_name) {
            fetchedName = data.product.product_name;
          } else {
            const resProd = await fetch(`https://world.openproductsfacts.org/api/v0/product/${decodedText}.json`);
            const dataProd = await resProd.json();
            if (dataProd.status === 1 && dataProd.product && dataProd.product.product_name) {
              fetchedName = dataProd.product.product_name;
            }
          }
        } catch (e) {
          console.warn("Product lookup failed:", e);
        }

        toggleScannerModal(false);
        toggleAddModal(true);
        dom.newItemName.value = fetchedName;
        dom.newItemBarcode.value = decodedText;
      }
    }

    // ADD MODAL & SPEED DIAL
    window.toggleAddModal = function(show) {
      if (show) {
        if (!dom.newItemBarcode.value) dom.newItemName.value = '';
        modalInitialQty = 1;
        dom.modalQtyVal.innerText = '1';
        selectedModalCategory = categories[0] || 'General';

        dom.modalCatGrid.innerHTML = categories.map(c => `
          <div class="modal-cat-pill ${c === selectedModalCategory ? 'active' : ''}" onclick="selectModalCategory('${c}')">${c}</div>
        `).join('');

        dom.addModalOverlay.classList.add('open');
      } else {
        dom.addModalOverlay.classList.remove('open');
      }
    };

    window.selectModalCategory = function(cat) {
      selectedModalCategory = cat;
      document.querySelectorAll('#modalCatGrid .modal-cat-pill').forEach(p => {
        p.classList.toggle('active', p.innerText === cat);
      });
    };

    window.adjustModalQty = function(delta) {
      modalInitialQty = Math.max(0, modalInitialQty + delta);
      dom.modalQtyVal.innerText = modalInitialQty;
    };

    window.addNewItem = async function() {
      const name = dom.newItemName.value.trim();
      if (!name) return alert("Please enter an item name.");

      await addDoc(itemsCol, {
        name,
        category: selectedModalCategory || 'General',
        amount: modalInitialQty,
        minStock: 1,
        barcode: dom.newItemBarcode.value || '',
        updatedAt: serverTimestamp()
      });

      toggleAddModal(false);
    };

    window.openSpeedDialMenu = function() {
      isSpeedDialOpen = true;
      dom.fabAdd.classList.add('is-open');
      dom.speedDialOverlay.classList.add('active');
      dom.speedDialMenu.classList.add('active');
      if (navigator.vibrate) navigator.vibrate(50);
    };

    window.closeSpeedDialMenu = function() {
      isSpeedDialOpen = false;
      dom.fabAdd.classList.remove('is-open');
      dom.speedDialOverlay.classList.remove('active');
      dom.speedDialMenu.classList.remove('active');
    };

    window.selectSpeedDialAction = function(action) {
      closeSpeedDialMenu();
      if (action === 'scan') toggleScannerModal(true);
      else if (action === 'manual') toggleAddModal(true);
    };

    function setupFabPressAndHold() {
      const btn = dom.fabAdd;
      let timer = null;
      let isLongPress = false;

      btn.addEventListener('pointerdown', () => {
        isLongPress = false;
        timer = setTimeout(() => {
          isLongPress = true;
          openSpeedDialMenu();
        }, 350);
      });

      btn.addEventListener('pointerup', (e) => {
        clearTimeout(timer);
        if (!isLongPress && !isSpeedDialOpen) {
          toggleAddModal(true);
        }
      });

      btn.addEventListener('pointercancel', () => clearTimeout(timer));
    }

    function renderShoppingTab() {
      const neededItems = items.filter(i => isItemOutOfStock(i) || isItemLowStock(i));
      
      if (neededItems.length > 0) {
        dom.shoppingBadge.style.display = 'block';
      } else {
        dom.shoppingBadge.style.display = 'none';
      }

      if (neededItems.length === 0) {
        dom.shoppingListContainer.innerHTML = `<div style="text-align:center; padding: 40px 0; color:var(--synced-color); font-size:15px; font-weight:700;">🎉 All garage items are fully stocked!</div>`;
        return;
      }

      dom.shoppingListContainer.innerHTML = neededItems.map(i => {
        const isBought = shoppingCart.has(i.id);
        return `
          <div class="shopping-item-row ${isBought ? 'is-bought' : ''}" onclick="toggleShoppingItem('${i.id}')">
            <div style="display:flex; align-items:center; gap:12px;">
              <div class="shopping-chk">${isBought ? '✓' : ''}</div>
              <div>
                <div class="shopping-title" style="font-weight:700; font-size:15px;">${i.name}</div>
                <div style="font-size:11px; color:var(--text-muted);">${i.category} • Needed</div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.toggleShoppingItem = function(id) {
      if (shoppingCart.has(id)) shoppingCart.delete(id);
      else shoppingCart.add(id);
      if (navigator.vibrate) navigator.vibrate(30);
      renderShoppingTab();
    };

    window.completeShoppingSession = async function() {
      if (shoppingCart.size === 0) return alert("Select at least one item marked as in-cart to restock.");
      
      const batch = writeBatch(db);
      shoppingCart.forEach(id => {
        batch.update(doc(db, "garage_items", id), {
          amount: increment(1),
          updatedAt: serverTimestamp()
        });
      });

      await batch.commit();
      shoppingCart.clear();
      renderShoppingTab();
      alert("Selected items restocked successfully!");
    };

    window.exportToBringApp = function() {
      const outItems = items.filter(isItemOutOfStock).map(i => i.name).join(',');
      const workerUrl = `https://billowing-forest-5301.swanson-ronan.workers.dev/?items=${encodeURIComponent(outItems)}`;
      window.location.href = `bring://import?url=${encodeURIComponent(workerUrl)}`;
    };

    window.openItemSettings = function(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      editingItemId = id;
      editingItemMinStock = item.minStock || 1;
      dom.editCatItemName.innerText = `Settings for "${item.name}"`;
      document.getElementById('editModalMinStockVal').innerText = `≤ ${editingItemMinStock} items`;

      dom.editCatPickerGrid.innerHTML = categories.map(c => `
        <div class="modal-cat-pill ${item.category === c ? 'active' : ''}" onclick="applyItemCategory('${c}')">${c}</div>
      `).join('');

      dom.editCatModalOverlay.classList.add('open');
    };

    window.closeItemCategoryPicker = function() {
      dom.editCatModalOverlay.classList.remove('open');
    };

    window.applyItemCategory = async function(cat) {
      if (!editingItemId) return;
      await updateDoc(doc(db, "garage_items", editingItemId), { category: cat });
      closeItemCategoryPicker();
    };

    window.adjustEditingItemMinStock = async function(delta) {
      if (!editingItemId) return;
      editingItemMinStock = Math.max(0, editingItemMinStock + delta);
      document.getElementById('editModalMinStockVal').innerText = `≤ ${editingItemMinStock} items`;
      await updateDoc(doc(db, "garage_items", editingItemId), { minStock: editingItemMinStock });
    };

    function render() {
      const outCount = items.filter(isItemOutOfStock).length;
      const lowCount = items.filter(isItemLowStock).length;
      dom.outCount.innerText = `${outCount} items`;
      dom.lowCount.innerText = `${lowCount} items`;

      let filtered = items.filter(i => {
        const matchesCategory = (currentFilter === "All" || i.category === currentFilter);
        const matchesSearch = !searchQuery || i.name.toLowerCase().includes(searchQuery) || (i.category && i.category.toLowerCase().includes(searchQuery));
        return matchesCategory && matchesSearch;
      });

      if (quickFilter === 'out') filtered = filtered.filter(isItemOutOfStock);
      if (quickFilter === 'low') filtered = filtered.filter(isItemLowStock);

      dom.filterBar.innerHTML = ["All", ...categories].map(c => `
        <div class="chip ${currentFilter === c ? 'active' : ''}" onclick="setFilter('${c}')">${c}</div>
      `).join('');

      dom.grid.innerHTML = filtered.map(item => {
        const isOut = isItemOutOfStock(item);
        const isLow = isItemLowStock(item);
        return `
          <div class="bento-card ${isOut ? 'is-out' : (isLow ? 'is-low' : '')}" onclick="openItemSettings('${item.id}')">
            <div>
              <div class="card-top">
                <span class="category-chip">${item.category || 'General'}</span>
                ${isOut ? '<span class="status-badge badge-out">OUT</span>' : (isLow ? '<span class="status-badge badge-low">LOW</span>' : '')}
              </div>
              <div class="card-title">${item.name}</div>
            </div>
            <div class="stepper-pill" onclick="event.stopPropagation()">
              <button class="stepper-btn" onclick="updateStock('${item.id}', -1, event)">—</button>
              <span class="stepper-count ${isOut ? 'count-out' : (isLow ? 'count-low' : '')}">${item.amount}</span>
              <button class="stepper-btn" onclick="updateStock('${item.id}', 1, event)">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.setFilter = function(cat) { currentFilter = cat; quickFilter = null; render(); };
    window.toggleQuickFilter = function(type) { quickFilter = quickFilter === type ? null : type; render(); };

    function renderCategorySettings() {
      dom.categoryManageList.innerHTML = categories.map(c => `
        <div class="cat-manage-row">
          <span style="font-weight:700;">${c}</span>
          <button class="cat-del-btn" onclick="deleteCategory('${c}')">✕</button>
        </div>
      `).join('');
    }

    window.addNewCategoryFromSettings = async function() {
      const val = document.getElementById('newCatInput').value.trim();
      if (val && !categories.includes(val)) {
        categories.push(val);
        await setDoc(metaDoc, { list: categories });
        document.getElementById('newCatInput').value = '';
      }
    };

    window.deleteCategory = async function(cat) {
      categories = categories.filter(c => c !== cat);
      await setDoc(metaDoc, { list: categories });
    };

    window.addEventListener('load', () => {
      setupFabPressAndHold();
      initRealtimeDatabase();
      dom.syncStatus.classList.remove('offline');
      dom.syncText.innerText = "Live";
    });
  </script>
</body>
</html>
